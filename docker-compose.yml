---
services:
  torrplay:
    image: rpfilomeno/torrplay:latest
    container_name: torrplay
    ports:
      - "8090:8090"
    volumes:
      - torrplay-data:/app/data
    command: ["--data-dir", "/app/data"]
    restart: unless-stopped

volumes:
  torrplay-data:
